  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - cmd/server/.env
    command: ["start-dev"]
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - app-network

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - cmd/server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network


  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
    networks:
      - app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  keycloak_data:

networks:
  app-network:
    driver: bridge
